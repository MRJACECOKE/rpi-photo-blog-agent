<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Memory gate decision diagram</title>
  <desc id="desc">A model must pass size, VLM process, and available memory gates before starting. Runtime limits cause only the current process group to stop.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="60" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">LLM admission and runtime safety gates</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="60" y="115" width="210" height="76" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="165" y="160" font-size="18" font-weight="700" fill="#0f172a">Candidate model</text>
    <path d="M270 153 H325" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <polygon points="430,105 535,153 430,201 325,153" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="430" y="146" font-size="15" font-weight="700" fill="#92400e">GGUF total</text><text x="430" y="166" font-size="15" fill="#92400e">≤ 12.5 GiB?</text>
    <path d="M535 153 H590" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="560" y="139" font-size="13" fill="#166534">yes</text>
    <polygon points="695,105 800,153 695,201 590,153" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="695" y="146" font-size="15" font-weight="700" fill="#1e40af">VLM PID</text><text x="695" y="166" font-size="15" fill="#1e40af">gone?</text>
    <path d="M800 153 H855" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="828" y="139" font-size="13" fill="#166534">yes</text>
    <polygon points="970,95 1085,153 970,211 855,153" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="970" y="145" font-size="15" font-weight="700" fill="#9a3412">MemAvailable</text><text x="970" y="166" font-size="15" fill="#9a3412">≥ 12,288 MiB?</text>
    <path d="M970 211 V278" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="993" y="245" font-size="13" fill="#166534">yes</text>
    <rect x="845" y="278" width="250" height="76" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="970" y="309" font-size="18" font-weight="700" fill="#5b21b6">Start LLM process group</text><text x="970" y="333" font-size="14" fill="#6d28d9">isolated session</text>
    <path d="M845 316 H650" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="380" y="265" width="270" height="102" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="515" y="295" font-size="18" font-weight="700" fill="#065f46">Runtime monitor</text><text x="515" y="320" font-size="14" fill="#047857">memory · swap · temperature</text><text x="515" y="344" font-size="14" fill="#047857">timeout · process RSS</text>
    <path d="M515 367 V425" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <polygon points="515,425 640,478 515,531 390,478" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="515" y="465" font-size="14" font-weight="700" fill="#991b1b">Any safety limit</text><text x="515" y="485" font-size="14" fill="#991b1b">exceeded?</text>
    <path d="M390 478 H270" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="332" y="463" font-size="13" fill="#b91c1c">yes</text>
    <rect x="60" y="437" width="210" height="82" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="165" y="470" font-size="16" font-weight="700" fill="#991b1b">Stop current group</text><text x="165" y="493" font-size="14" fill="#b91c1c">TERM → grace → KILL</text>
    <path d="M640 478 H845" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="740" y="463" font-size="13" fill="#166534">no</text>
    <rect x="845" y="437" width="250" height="82" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="970" y="470" font-size="17" font-weight="700" fill="#166534">Complete and validate</text><text x="970" y="493" font-size="14" fill="#15803d">write output + metrics</text>
    <path d="M430 201 V570 H165 V519" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="405" y="225" font-size="13" fill="#b91c1c">no</text>
    <path d="M695 201 V552 H235 V519" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="715" y="225" font-size="13" fill="#b91c1c">no</text>
    <path d="M1085 153 H1140 V395 H1095" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="1125" y="137" font-size="13" fill="#b45309">wait / timeout</text>
  </g>
</svg>
