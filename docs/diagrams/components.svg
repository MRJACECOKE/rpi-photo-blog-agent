<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Photo blog agent components</title>
  <desc id="desc">The orchestrator controls preprocessing, process runners, memory guard and validation, producing isolated run artifacts and a final blog.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/>
  <text x="60" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Component architecture</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="55" y="135" width="185" height="78" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="148" y="168" font-size="18" font-weight="700" fill="#0f172a">CLI request</text><text x="148" y="192" font-size="14" fill="#64748b">image + preferences</text>
    <rect x="330" y="105" width="300" height="138" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="480" y="154" font-size="21" font-weight="700" fill="#075985">Orchestrator</text><text x="480" y="184" font-size="15" fill="#0369a1">state machine · single-run lock</text><text x="480" y="208" font-size="15" fill="#0369a1">handoff policy · atomic outputs</text>
    <rect x="720" y="85" width="200" height="78" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="820" y="119" font-size="18" font-weight="700" fill="#065f46">Memory guard</text><text x="820" y="143" font-size="14" fill="#047857">/proc + thermal</text>
    <rect x="720" y="190" width="200" height="78" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="820" y="224" font-size="18" font-weight="700" fill="#92400e">Output gates</text><text x="820" y="248" font-size="14" fill="#b45309">JSON + Markdown</text>
    <rect x="330" y="335" width="220" height="82" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="440" y="370" font-size="18" font-weight="700" fill="#075985">VLM subprocess</text><text x="440" y="395" font-size="14" fill="#0369a1">llama-mtmd-cli</text>
    <rect x="650" y="335" width="220" height="82" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="760" y="370" font-size="18" font-weight="700" fill="#5b21b6">LLM subprocess</text><text x="760" y="395" font-size="14" fill="#6d28d9">llama-completion</text>
    <rect x="940" y="335" width="205" height="116" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1043" y="370" font-size="18" font-weight="700" fill="#166534">Artifacts</text><text x="1043" y="395" font-size="14" fill="#15803d">stdout · stderr</text><text x="1043" y="418" font-size="14" fill="#15803d">metrics · blog.md</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M240 174 H320"/><path d="M630 150 H710"/><path d="M630 205 H710"/>
    <path d="M440 243 V325"/><path d="M545 243 L730 325"/><path d="M550 376 H640"/><path d="M870 376 H930"/>
  </g>
  <path d="M870 400 C920 500 300 520 330 402" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="600" y="493" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#9a3412">process boundary guarantees model memory release before the next stage</text>
</svg>
