<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" role="img" aria-labelledby="sm-title sm-desc">
  <title id="sm-title">Job 상태머신과 재개(resume) 동작</title>
  <desc id="sm-desc">각 스테이지는 다섯 가지 상태만 가지며, 완료된 스테이지는 재실행 시 건너뛴다. VISION 스테이지는 사진 단위로 재개된다.</desc>
  <defs>
    <marker id="sm-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="sm-arrow-g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <filter id="sm-shadow"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.13"/></filter>
  </defs>

  <rect width="1500" height="640" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">Job 상태머신 · 중단과 재개</text>
  <text x="60" y="90" font-family="sans-serif" font-size="16" fill="#475569">상태는 <tspan font-family="monospace" font-size="14">state/jobs/&lt;job_id&gt;.json</tspan> 에 스테이지 시작·종료마다 atomic write (temp → os.replace)</text>

  <!-- 상태 값 범례 -->
  <g font-family="sans-serif">
    <text x="60" y="132" font-size="14" font-weight="700" fill="#334155">허용된 상태 값 5가지 (이외는 쓰지 않는다)</text>
    <g font-size="12.5">
      <rect x="60" y="146" width="150" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="135" y="166" text-anchor="middle" fill="#475569">NOT_STARTED</text>
      <rect x="222" y="146" width="150" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="297" y="166" text-anchor="middle" fill="#1e40af">IN_PROGRESS</text>
      <rect x="384" y="146" width="150" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="459" y="166" text-anchor="middle" fill="#166534">SUCCESS</text>
      <rect x="546" y="146" width="215" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="653" y="166" text-anchor="middle" fill="#92400e">FAILED_RECOVERABLE</text>
      <rect x="773" y="146" width="205" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="875" y="166" text-anchor="middle" fill="#991b1b">BLOCKED_EXTERNAL</text>
    </g>
    <text x="1000" y="166" font-size="12.5" fill="#64748b">전략을 바꿔 재시도 →</text>
    <text x="1000" y="184" font-size="12.5" fill="#64748b">사람 조치 필요 →</text>
    <text x="1152" y="166" font-size="12.5" font-weight="700" fill="#92400e">FAILED_RECOVERABLE</text>
    <text x="1152" y="184" font-size="12.5" font-weight="700" fill="#991b1b">BLOCKED_EXTERNAL</text>
  </g>

  <!-- 스테이지 흐름 -->
  <g font-family="sans-serif" filter="url(#sm-shadow)">
    <rect x="60" y="230" width="200" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="160" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">STAGE_1_PREP</text>
    <text x="160" y="282" text-anchor="middle" font-size="12" fill="#14532d">재실행 시 건너뜀</text>

    <rect x="300" y="230" width="230" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="415" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">STAGE_2_VISION</text>
    <text x="415" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">사진 단위로 재개</text>

    <rect x="570" y="230" width="200" height="76" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="670" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">STAGE_3_UNLOAD</text>
    <text x="670" y="282" text-anchor="middle" font-size="12" fill="#7c2d12">항상 다시 검증</text>

    <rect x="810" y="230" width="200" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="910" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">STAGE_4_WRITE</text>
    <text x="910" y="282" text-anchor="middle" font-size="12" fill="#4c1d95">항상 다시 생성</text>

    <rect x="1050" y="230" width="185" height="76" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="1142" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">STAGE_5_QUALITY</text>
    <text x="1142" y="282" text-anchor="middle" font-size="12" fill="#14532d">규칙 기반</text>

    <rect x="1275" y="230" width="165" height="76" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="1357" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">STAGE_6_OUTPUT</text>
    <text x="1357" y="282" text-anchor="middle" font-size="12" fill="#14532d">atomic write</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#sm-arrow)">
    <path d="M262,268 L296,268"/>
    <path d="M532,268 L566,268"/>
    <path d="M772,268 L806,268"/>
    <path d="M1012,268 L1046,268"/>
    <path d="M1237,268 L1271,268"/>
  </g>

  <!-- 중단 시나리오 -->
  <g font-family="sans-serif" filter="url(#sm-shadow)">
    <rect x="60" y="352" width="680" height="256" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="85" y="382" font-size="16" font-weight="700" fill="#991b1b">사진 3장 중 2장째에서 전원이 끊기면</text>

    <text x="85" y="414" font-size="13.5" fill="#334155">중단 시점 상태:</text>
    <text x="105" y="438" font-size="13" fill="#334155">STAGE_1_PREP = <tspan font-weight="700" fill="#166534">SUCCESS</tspan></text>
    <text x="105" y="460" font-size="13" fill="#334155">STAGE_2_VISION = <tspan font-weight="700" fill="#1e40af">IN_PROGRESS</tspan> · 사진 1장만 vision JSON 존재</text>
    <text x="105" y="482" font-size="13" fill="#334155">state/run.lock = 죽은 PID가 적힌 stale lock</text>

    <text x="85" y="516" font-size="13.5" fill="#334155">재실행 시:</text>
    <text x="105" y="540" font-size="13" fill="#334155">① stale lock 자동 인수 (PID 생존 확인 후)</text>
    <text x="105" y="562" font-size="13" fill="#334155">② PREP 건너뜀</text>
    <text x="105" y="584" font-size="13" fill="#334155">③ 1장은 기존 결과 재사용, 2·3장만 새로 분석</text>
  </g>

  <!-- 왜 이렇게 -->
  <g font-family="sans-serif" filter="url(#sm-shadow)">
    <rect x="770" y="352" width="670" height="256" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="795" y="382" font-size="16" font-weight="700" fill="#075985">어디까지 재개하고 어디부터 다시 하는가</text>

    <text x="795" y="416" font-size="13.5" fill="#334155"><tspan font-weight="700" fill="#166534">재개한다 — PREP, VISION</tspan></text>
    <text x="815" y="440" font-size="13" fill="#334155">결정적(deterministic)이고 비싸다. VISION은 사진 4장에</text>
    <text x="815" y="462" font-size="13" fill="#334155">약 11분이 걸린다. 여기서의 재개가 이득의 대부분이다.</text>

    <text x="795" y="498" font-size="13.5" fill="#334155"><tspan font-weight="700" fill="#9a3412">항상 다시 한다 — UNLOAD</tspan></text>
    <text x="815" y="522" font-size="13" fill="#334155">메모리 상태는 과거 기록을 믿을 수 없다. 매번 실측한다.</text>

    <text x="795" y="558" font-size="13.5" fill="#334155"><tspan font-weight="700" fill="#5b21b6">항상 다시 한다 — WRITE</tspan></text>
    <text x="815" y="582" font-size="13" fill="#334155">생성 단계다. 재실행이 곧 "재생성"의 의미이고,</text>
    <text x="815" y="600" font-size="13" fill="#334155">GUI의 [재생성] 버튼이 같은 경로를 쓴다.</text>
  </g>
</svg>
