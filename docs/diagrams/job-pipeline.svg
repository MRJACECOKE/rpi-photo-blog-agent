<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660" role="img" aria-labelledby="jp-title jp-desc">
  <title id="jp-title">사진 폴더에서 블로그 텍스트까지 6단계 파이프라인</title>
  <desc id="jp-desc">사용자가 올린 사진이 전처리, VLM 분석, 언로드 게이트, LLM 작성, 품질 검사, 산출물 저장 6단계를 거쳐 텍스트 파일이 된다. VLM과 LLM은 절대 동시에 메모리에 올라가지 않는다.</desc>
  <defs>
    <marker id="jp-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="jp-arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <filter id="jp-shadow"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.13"/></filter>
  </defs>

  <rect width="1500" height="660" rx="24" fill="#f8fafc"/>
  <text x="60" y="60" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">사진 폴더 → 블로그 .txt 파이프라인</text>
  <text x="60" y="94" font-family="sans-serif" font-size="17" fill="#475569">Raspberry Pi 5 16GB · 완전 로컬 추론 · VLM과 LLM은 절대 동시에 적재되지 않는다</text>

  <!-- 입력 -->
  <g font-family="sans-serif" filter="url(#jp-shadow)">
    <rect x="60" y="140" width="200" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="160" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">inbox/&lt;job_id&gt;/</text>
    <text x="160" y="202" text-anchor="middle" font-size="14" fill="#64748b">사용자 원본 사진</text>
    <text x="160" y="222" text-anchor="middle" font-size="13" fill="#dc2626">읽기 전용 · 수정 금지</text>
  </g>

  <!-- STAGE 1 -->
  <g font-family="sans-serif" filter="url(#jp-shadow)">
    <rect x="310" y="128" width="215" height="120" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="417" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#075985">STAGE_1_PREP</text>
    <text x="417" y="182" text-anchor="middle" font-size="13" fill="#334155">사본 2벌 생성 (768 / 1600px)</text>
    <text x="417" y="202" text-anchor="middle" font-size="13" fill="#334155">EXIF 제거 후 검증</text>
    <text x="417" y="222" text-anchor="middle" font-size="13" fill="#334155">sha256 중복 제거</text>
    <text x="417" y="240" text-anchor="middle" font-size="13" fill="#b45309">개인정보 1차 검사</text>
  </g>

  <!-- STAGE 2 -->
  <g font-family="sans-serif" filter="url(#jp-shadow)">
    <rect x="575" y="128" width="215" height="120" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="682" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#075985">STAGE_2_VISION</text>
    <text x="682" y="182" text-anchor="middle" font-size="13" fill="#0c4a6e">Qwen2.5-VL-3B (VLM)</text>
    <text x="682" y="202" text-anchor="middle" font-size="13" fill="#0c4a6e">사진 1장씩 순차 · 배치 금지</text>
    <text x="682" y="222" text-anchor="middle" font-size="13" fill="#0c4a6e">구조화 JSON 출력</text>
    <text x="682" y="240" text-anchor="middle" font-size="13" fill="#b45309">개인정보 2차 검사</text>
  </g>

  <!-- STAGE 3 게이트 -->
  <g font-family="sans-serif" filter="url(#jp-shadow)">
    <rect x="840" y="118" width="230" height="140" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="955" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">STAGE_3_UNLOAD</text>
    <text x="955" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">실측으로 검증하는 게이트</text>
    <text x="955" y="194" text-anchor="middle" font-size="13" fill="#7c2d12">① PID 소멸 확인</text>
    <text x="955" y="214" text-anchor="middle" font-size="13" fill="#7c2d12">② MemAvailable 폴링</text>
    <text x="955" y="234" text-anchor="middle" font-size="13" fill="#7c2d12">③ 미달 시 drop_caches</text>
    <text x="955" y="252" text-anchor="middle" font-size="13" fill="#7c2d12">④ 그래도 미달 → tier 하향</text>
  </g>

  <!-- STAGE 4 -->
  <g font-family="sans-serif" filter="url(#jp-shadow)">
    <rect x="1120" y="128" width="215" height="120" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="1227" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">STAGE_4_WRITE</text>
    <text x="1227" y="182" text-anchor="middle" font-size="13" fill="#4c1d95">Qwen3-30B-A3B (LLM)</text>
    <text x="1227" y="202" text-anchor="middle" font-size="13" fill="#4c1d95">llama-server 1회 기동</text>
    <text x="1227" y="222" text-anchor="middle" font-size="13" fill="#4c1d95">섹션 12개 순차 생성</text>
    <text x="1227" y="240" text-anchor="middle" font-size="13" fill="#4c1d95">KV 캐시 재사용</text>
  </g>

  <!-- 화살표 1행 -->
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#jp-arrow)">
    <path d="M262,188 L306,188"/>
    <path d="M527,188 L571,188"/>
    <path d="M792,188 L836,188"/>
    <path d="M1072,188 L1116,188"/>
  </g>

  <!-- 아래로 -->
  <path d="M1227,250 L1227,300 L780,300 L780,336" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#jp-arrow)"/>
  <text x="1010" y="292" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">LLM 언로드 후 (모델 미적재 상태)</text>

  <!-- STAGE 5 -->
  <g font-family="sans-serif" filter="url(#jp-shadow)">
    <rect x="575" y="340" width="410" height="130" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="780" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">STAGE_5_QUALITY · 규칙 기반 (LLM 재호출 없음)</text>
    <text x="600" y="398" font-size="13" fill="#334155">· 금칙어: 가격 · 전화번호 · 시공 주장 · 후기 · 인증 · 치수</text>
    <text x="600" y="420" font-size="13" fill="#334155">· 근거 없는 브랜드명 / 지역명 + 시공 주장</text>
    <text x="600" y="442" font-size="13" fill="#334155">· 문장 반복 · 3-gram 자기중복 · 한글 비율</text>
    <text x="600" y="462" font-size="13" fill="#334155">· 이미지 1:1 대응 · ALT 존재 · 보류 사진 노출 여부</text>
  </g>

  <!-- 재생성 루프 -->
  <path d="M985,380 L1080,380 L1080,300 L1300,300 L1300,254" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#jp-arrow-red)"/>
  <text x="1160" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#dc2626">실패한 섹션만 재생성 (최대 3회)</text>
  <text x="1160" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">전체 재작성 아님</text>

  <!-- STAGE 6 -->
  <g font-family="sans-serif" filter="url(#jp-shadow)">
    <rect x="310" y="340" width="215" height="130" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="417" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">STAGE_6_OUTPUT</text>
    <text x="417" y="396" text-anchor="middle" font-size="13" fill="#14532d">&lt;slug&gt;.txt</text>
    <text x="417" y="418" text-anchor="middle" font-size="13" fill="#14532d">&lt;slug&gt;.meta.json</text>
    <text x="417" y="440" text-anchor="middle" font-size="13" fill="#14532d">images/ (보류 사진 제외)</text>
    <text x="417" y="460" text-anchor="middle" font-size="12" fill="#15803d">atomic write</text>
  </g>
  <path d="M571,405 L529,405" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#jp-arrow)"/>

  <!-- 결과 -->
  <g font-family="sans-serif" filter="url(#jp-shadow)">
    <rect x="60" y="352" width="200" height="106" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="160" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">GUI / CLI</text>
    <text x="160" y="412" text-anchor="middle" font-size="13" fill="#64748b">미리보기 · 편집 · 저장</text>
    <text x="160" y="434" text-anchor="middle" font-size="13" fill="#64748b">다운로드 · 재생성</text>
  </g>
  <path d="M306,405 L264,405" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#jp-arrow)"/>

  <!-- 하단 원칙 박스 -->
  <g font-family="sans-serif">
    <rect x="60" y="510" width="1380" height="112" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="85" y="540" font-size="15" font-weight="700" fill="#0f172a">이 설계를 지배하는 제약</text>
    <text x="85" y="568" font-size="13.5" fill="#334155">· <tspan font-weight="700">메모리</tspan>: 16GB에 30B급 LLM(10.1GiB)과 VLM(2.7GiB)이 동시에 올라갈 수 없다 → 순차 실행 + 실측 언로드 게이트</text>
    <text x="85" y="590" font-size="13.5" fill="#334155">· <tspan font-weight="700">속도</tspan>: 프롬프트 처리 7~8 tok/s가 병목 → 작성 단계만 llama-server로 KV 캐시 재사용 (VLM은 캐시 이득이 없어 one-shot 유지)</text>
    <text x="85" y="612" font-size="13.5" fill="#334155">· <tspan font-weight="700">사실성</tspan>: LLM에 원본 이미지를 넣지 않는다. VLM이 만든 JSON만 근거로 쓰고, 그 밖의 사실은 규칙으로 차단한다</text>
  </g>
</svg>
