<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="pt-title pt-desc">
  <title id="pt-title">개인정보 2단 검사와 잠정 보류 해제 규칙</title>
  <desc id="pt-desc">규칙 기반 1차 검사와 VLM 2차 검사를 조합한다. 얼굴 검출 점수가 확정 임계값 이상이면 무조건 보류하고, 애매한 구간은 VLM이 부정할 때만 해제한다.</desc>
  <defs>
    <marker id="pt-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="pt-shadow"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.13"/></filter>
  </defs>

  <rect width="1500" height="700" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">개인정보 2단 검사 — 왜 임계값 하나로는 안 되는가</text>
  <text x="60" y="90" font-family="sans-serif" font-size="16" fill="#475569">실측 문제: 주방 사진의 <tspan font-weight="700">조명 기구 장식</tspan>이 얼굴로 오검출됐다 (점수 0.767)</text>

  <!-- 입력 -->
  <g font-family="sans-serif" filter="url(#pt-shadow)">
    <rect x="60" y="140" width="180" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">사진 1장</text>
    <text x="150" y="198" text-anchor="middle" font-size="13" fill="#64748b">EXIF 제거된 사본</text>
  </g>

  <!-- 1차 -->
  <g font-family="sans-serif" filter="url(#pt-shadow)">
    <rect x="300" y="128" width="290" height="180" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="445" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#075985">1차 · 규칙 기반 (오프라인)</text>
    <text x="322" y="186" font-size="13" fill="#334155">· 얼굴: OpenCV YuNet (ONNX)</text>
    <text x="322" y="210" font-size="13" fill="#334155">· QR / 바코드: cv2 내장 검출기</text>
    <text x="322" y="234" font-size="13" fill="#334155">· GPS: 원본 EXIF 확인 후 기록</text>
    <text x="322" y="258" font-size="13" fill="#334155">· EXIF 제거 여부 재검증</text>
    <text x="322" y="288" font-size="12" fill="#dc2626">OpenCV 5.x가 Haar cascade를 제거해 YuNet 사용</text>
  </g>
  <path d="M242,180 L296,180" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#pt-arrow)"/>

  <!-- 분기 -->
  <g font-family="sans-serif" filter="url(#pt-shadow)">
    <rect x="650" y="128" width="250" height="180" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="775" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">얼굴 점수로 분기</text>
    <text x="672" y="192" font-size="13.5" font-weight="700" fill="#7c2d12">≥ 0.90 → 확정 보류</text>
    <text x="672" y="214" font-size="12.5" fill="#7c2d12">VLM 결과와 무관하게 유지</text>
    <text x="672" y="248" font-size="13.5" font-weight="700" fill="#7c2d12">0.75 ~ 0.90 → 잠정 보류</text>
    <text x="672" y="270" font-size="12.5" fill="#7c2d12">2차 검사로 확인 필요</text>
    <text x="672" y="296" font-size="12.5" fill="#166534">&lt; 0.75 → 통과</text>
  </g>
  <path d="M592,196 L646,196" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#pt-arrow)"/>

  <!-- 2차 -->
  <g font-family="sans-serif" filter="url(#pt-shadow)">
    <rect x="960" y="128" width="290" height="180" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="1105" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#075985">2차 · VLM privacy_flags</text>
    <text x="982" y="186" font-size="13" fill="#0c4a6e">· face — 얼굴</text>
    <text x="982" y="210" font-size="13" fill="#0c4a6e">· text_pii — 전화번호 · 주소 · 명함</text>
    <text x="982" y="234" font-size="13" fill="#0c4a6e">· plate — 차량번호</text>
    <text x="982" y="258" font-size="13" fill="#0c4a6e">· signage — 상호 간판</text>
    <text x="982" y="288" font-size="12" fill="#0369a1">문자 PII는 규칙으로 못 잡아 VLM에 의존한다</text>
  </g>
  <path d="M902,196 L956,196" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#pt-arrow)"/>

  <!-- 결과 3종 -->
  <text x="60" y="368" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a">실행에서 실제로 나온 세 가지 결과</text>

  <g font-family="sans-serif" filter="url(#pt-shadow)">
    <rect x="60" y="392" width="440" height="182" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="85" y="422" font-size="15" font-weight="700" fill="#991b1b">① 진짜 인물 사진 → 보류 유지</text>
    <text x="85" y="450" font-size="13" fill="#334155">1차: 얼굴 점수 <tspan font-weight="700">0.91</tspan> → 확정 보류</text>
    <text x="85" y="474" font-size="13" fill="#334155">2차: VLM도 face=true 로 확인</text>
    <text x="85" y="500" font-size="13" fill="#334155">두 검사가 독립적으로 일치했다.</text>
    <text x="85" y="528" font-size="13" font-weight="700" fill="#991b1b">→ PRIVACY_HOLD · 본문 제외</text>
    <text x="85" y="552" font-size="12.5" fill="#7f1d1d">VLM 분석 자체를 건너뛴다 (불필요한 노출 회피)</text>
  </g>

  <g font-family="sans-serif" filter="url(#pt-shadow)">
    <rect x="530" y="392" width="440" height="182" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="555" y="422" font-size="15" font-weight="700" fill="#166534">② 조명 기구 오탐 → 보류 해제</text>
    <text x="555" y="450" font-size="13" fill="#334155">1차: 얼굴 점수 <tspan font-weight="700">0.767</tspan> → 잠정 보류</text>
    <text x="555" y="474" font-size="13" fill="#334155">2차: VLM은 face=false</text>
    <text x="555" y="500" font-size="13" fill="#334155">두 검사가 모두 부정할 때만 푼다.</text>
    <text x="555" y="528" font-size="13" font-weight="700" fill="#166534">→ OK · 본문에 사용</text>
    <text x="555" y="552" font-size="12.5" fill="#14532d">해제 사유도 job 기록에 남긴다</text>
  </g>

  <g font-family="sans-serif" filter="url(#pt-shadow)">
    <rect x="1000" y="392" width="440" height="182" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1025" y="422" font-size="15" font-weight="700" fill="#0f172a">③ 일반 주방 사진 → 통과</text>
    <text x="1025" y="450" font-size="13" fill="#334155">1차: 검출 없음</text>
    <text x="1025" y="474" font-size="13" fill="#334155">2차: 모든 플래그 false</text>
    <text x="1025" y="500" font-size="13" fill="#334155">정상 경로. 추가 비용 없음.</text>
    <text x="1025" y="528" font-size="13" font-weight="700" fill="#166534">→ OK · 본문에 사용</text>
  </g>

  <!-- 결론 -->
  <g font-family="sans-serif" filter="url(#pt-shadow)">
    <rect x="60" y="596" width="1380" height="80" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="85" y="626" font-size="15" font-weight="700" fill="#9a3412">왜 임계값을 그냥 올리지 않았는가</text>
    <text x="85" y="654" font-size="13.5" fill="#334155">올리면 멀리 있거나 측면인 <tspan font-weight="700">진짜 얼굴</tspan>을 놓치고, 내리면 멀쩡한 사진이 <tspan font-weight="700">영구히</tspan> 제외된다. 둘 다 실패다. 애매한 구간만 두 번째 근거로 판정하는 구조가 정답이었다.</text>
  </g>
</svg>
