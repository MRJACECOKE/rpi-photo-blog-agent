# 로컬 블로그 에이전트 런타임 설정
# 모든 상대 경로는 프로젝트 루트 기준이다.
version: 1

paths:
  inbox_dir: inbox
  work_dir: work
  output_dir: output
  state_dir: state
  logs_dir: logs
  bench_dir: bench

lock:
  path: state/run.lock
  # lock 파일에 기록된 PID가 살아있지 않으면 stale lock으로 간주하고 자동 해제한다.
  stale_takeover: true

memory:
  # VLM 시작 전 최소 여유 메모리
  min_free_mb_for_vlm: 4096
  # LLM 시작 전 최소 여유 메모리. 실제 값은 선택된 tier의 expected_rss_mb + headroom_mb로 다시 계산된다.
  min_free_mb_for_llm: 12288
  # 언로드 게이트에서 요구하는 추가 여유분
  headroom_mb: 1500
  # 실행 중 이 값 아래로 떨어지면 프로세스를 안전 중단한다.
  min_free_mb_during_run: 1024
  # 언로드 후 메모리 회수를 기다리는 최대 시간과 폴링 간격
  unload_wait_timeout_sec: 60
  unload_poll_interval_sec: 2.0
  # root 권한일 때만 drop_caches를 시도한다.
  allow_cache_drop: true
  # swap 사용률이 이 값을 넘으면 실행 중인 모델을 중단한다.
  max_swap_used_percent: 85.0

thermal:
  # 이 온도를 넘으면 지정 시간만큼 대기한 뒤 계속한다. 중단하지 않는다.
  pause_above_celsius: 80.0
  pause_seconds: 30
  # 이 온도를 넘으면 안전 중단한다.
  abort_above_celsius: 88.0

timeouts:
  # 실행 타임아웃. Phase 0 합격 기준인 180초(models.yaml:gates)와는 다른 값이다.
  # 실측 평균이 약 167초라 타임아웃을 180초로 두면 여유가 13초뿐이고,
  # 조금 복잡한 사진 하나 때문에 분석을 통째로 잃는다.
  # 게이트 초과는 경고로 남기고, 실행은 살린다.
  vlm_per_image_sec: 300
  llm_server_start_sec: 300
  llm_section_sec: 900
  llm_total_sec: 7200
  process_terminate_grace_sec: 15

images:
  # VLM 입력용 긴 변 픽셀. 선택된 tier의 image_max_edge가 있으면 그 값이 우선한다.
  # 실측(bench/RESULTS.md)에서 1024px는 180s 게이트를 초과해 768px로 확정했다.
  vlm_max_edge: 768
  # 게시 출력용 긴 변 픽셀
  publish_max_edge: 1600
  publish_format: WEBP
  publish_quality: 82
  vlm_format: JPEG
  vlm_quality: 88
  max_images_per_job: 12
  allowed_suffixes: [".jpg", ".jpeg", ".png", ".webp", ".heic", ".heif"]

privacy:
  # OpenCV YuNet(ONNX) 기반 얼굴 1차 검사. 모델이나 opencv가 없으면 그 사실을 detector_status에 남긴다.
  # OpenCV 5.x는 Haar cascade(CascadeClassifier)를 제거했으므로 YuNet을 쓴다.
  face_detection: true
  # 이 점수 이상이면 얼굴 후보로 본다.
  face_score_threshold: 0.75
  # 이 점수 이상이면 VLM 결과와 무관하게 확정 보류한다.
  # 실측 근거: 조명 기구 장식을 얼굴로 오검출한 사례의 점수가 0.767이었다(bench 기록).
  # 그래서 0.90 미만은 '잠정 보류'로 두고 VLM 2차 검사가 부정하면 해제한다.
  face_confirm_score: 0.90
  face_nms_threshold: 0.3
  # 긴 변 대비 이 비율보다 작은 검출은 무시한다.
  face_min_size_ratio: 0.04
  # EXIF에 GPS가 있으면 원본 단계에서 기록한다(사본에서는 제거된다).
  flag_gps_in_original: true

gui:
  host: "0.0.0.0"
  port: 8770
  # 값이 비어 있으면 인증 없이 LAN 전용으로 동작한다.
  auth_token: ""
  max_upload_mb: 60
  log_tail_lines: 200

disk:
  # 이 값보다 여유가 적으면 BLOCKED_EXTERNAL로 멈춘다.
  # work/ 캐시를 자동 삭제하지 않는다. 정리 대상만 안내한다.
  min_free_gib: 2.0

concurrency:
  # 파이프라인은 항상 1개만 실행한다. VLM/LLM 동시 적재 금지가 이 값의 근거다.
  max_parallel_jobs: 1
